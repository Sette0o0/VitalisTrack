services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vitalis}
      POSTGRES_USER: ${POSTGRES_USER:-vitalis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitalis}
    ports:
      - "5432:5432"
    volumes:
      - vitalis-postgres18:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vitalis} -d ${POSTGRES_DB:-vitalis}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vitalis}:${POSTGRES_PASSWORD:-vitalis}@postgres:5432/${POSTGRES_DB:-vitalis}
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-this-value}
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_BASE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  vitalis-postgres18:
