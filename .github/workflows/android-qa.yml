name: Android QA
on:
  workflow_dispatch:
  pull_request:
jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vitalis_qa
          POSTGRES_USER: vitalis
          POSTGRES_PASSWORD: vitalis
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vitalis -d vitalis_qa" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://vitalis:vitalis@localhost:5432/vitalis_qa
      JWT_SECRET: qa-secret-at-least-thirty-two-characters
      EXPO_PUBLIC_API_URL: http://10.0.2.2:3000
      PUBLIC_BASE_URL: http://10.0.2.2:3000
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      ANDROID_QA: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Verify app workspace lockfile
        working-directory: app
        run: pnpm install --frozen-lockfile --lockfile-only --ignore-scripts
      - run: pnpm db:generate
      - run: pnpm --filter @vitalis/server db:deploy
      - name: Install Maestro CLI
        run: |
          curl -fsSL https://get.maestro.mobile.dev -o /tmp/install-maestro.sh
          bash /tmp/install-maestro.sh
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android release bundle
        working-directory: app
        env:
          NODE_ENV: production
          BABEL_ENV: production
        run: >-
          pnpm exec expo export:embed --platform android --dev false
          --minify false --max-workers 2
          --bundle-output ../artifacts/android/index.android.bundle
          --assets-dest ../artifacts/android/assets
          --sourcemap-output ../artifacts/android/index.android.bundle.map
      - name: Build release APK
        working-directory: app
        env:
          NODE_ENV: production
          BABEL_ENV: production
        run: |
          pnpm exec expo prebuild --platform android --no-install
          cd android
          ./gradlew --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64 assembleRelease
      - name: Start QA API
        env:
          NODE_ENV: test
        run: |
          pnpm --filter @vitalis/server dev > /tmp/vitalis-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install app/android/app/build/outputs/apk/release/app-release.apk
            maestro test -e QA_EMAIL=qa-${{ github.run_id }}-${{ github.run_attempt }}@example.com --format junit --output artifacts/maestro.xml .maestro/sprint-1-smoke.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-qa
          path: |
            app/android/app/build/outputs/apk/release/*.apk
            artifacts/
            ~/.maestro/tests/
