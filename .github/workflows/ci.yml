name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vitalis
          POSTGRES_USER: vitalis
          POSTGRES_PASSWORD: vitalis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vitalis -d vitalis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vitalis:vitalis@localhost:5432/vitalis
      JWT_SECRET: ci-secret-with-at-least-thirty-two-characters
      PUBLIC_BASE_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify app workspace lockfile
        working-directory: app
        run: pnpm install --frozen-lockfile --lockfile-only --ignore-scripts
      - run: pnpm db:generate
      - run: pnpm --filter @vitalis/server db:deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @vitalis/contracts test
      - run: pnpm --filter vitalis-track test:coverage
      - run: pnpm --filter @vitalis/server test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-coverage
          path: |
            app/coverage/
            server/coverage/
      - run: pnpm build
