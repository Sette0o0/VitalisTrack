appId: com.vitalistrack.app
name: Cadastro, hidratação e cache offline da Sprint 1
---
- launchApp:
    clearState: true
- tapOn: "Criar conta"
- scrollUntilVisible:
    element:
      id: auth-name
- tapOn:
    id: auth-name
- inputText: "Pessoa QA"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: auth-email
- tapOn:
    id: auth-email
- inputText: ${QA_EMAIL}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: auth-password
- tapOn:
    id: auth-password
- inputText: "qa-12345678"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: auth-confirm
- tapOn:
    id: auth-confirm
- inputText: "qa-12345678"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: auth-submit
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    visible: "Seu resumo"
    timeout: 20000
- scrollUntilVisible:
    element: "Abrir hidratação"
- tapOn: "Abrir hidratação"
- tapOn:
    id: water-200
- tapOn:
    id: water-500
- tapOn:
    id: water-1000
- assertVisible: "1.700 mL"
- takeScreenshot: hydration-online
- setAirplaneMode: enabled
- tapOn:
    id: water-200
- assertVisible: "1.900 mL"
- stopApp
- launchApp
- assertVisible: "Seu resumo"
- scrollUntilVisible:
    element: "Abrir hidratação"
- tapOn: "Abrir hidratação"
- assertVisible: "1.900 mL"
- takeScreenshot: hydration-offline-restored
- setAirplaneMode: disabled
- back
- tapOn: "Perfil"
- scrollUntilVisible:
    element: "Sair da conta"
- tapOn: "Sair da conta"
- extendedWaitUntil:
    visible: "Entre na sua conta"
    timeout: 10000
